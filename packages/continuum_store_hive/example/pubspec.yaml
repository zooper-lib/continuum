name: continuum_store_hive_example
description: Example demonstrating the Continuum Hive event store.
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  zooper_flutter_core: ^2.0.0
  bounded: ^2.0.0
  continuum:
    path: ../../continuum
  continuum_event_sourcing:
    path: ../../continuum_event_sourcing
  continuum_store_hive:
    path: ../
  continuum_uow:
    path: ../../continuum_uow
  hive: ^2.2.3

dev_dependencies:
  build_runner: ^2.4.15
  lints: ^3.0.0
  continuum_generator:
    path: ../../continuum_generator

dependency_overrides:
  continuum:
    path: ../../continuum
  continuum_event_sourcing:
    path: ../../continuum_event_sourcing
  continuum_uow:
    path: ../../continuum_uow