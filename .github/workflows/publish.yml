name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install workspace deps
        run: dart pub get

      - name: Activate Melos
        run: |
          dart pub global activate melos 7.3.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap
        run: melos bootstrap

      - name: Analyze
        run: melos run analyze --no-select

      - name: Test
        run: melos run test --no-select

      - name: Configure pub.dev credentials
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          test -n "$PUB_CREDENTIALS"
          mkdir -p "$HOME/.config/dart"
          printf '%s' "$PUB_CREDENTIALS" > "$HOME/.config/dart/pub-credentials.json"

      - name: Copy root CHANGELOG into all packages
        run: |
          for dir in packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/pubspec.yaml" ]; then
              cp CHANGELOG.md "$dir/CHANGELOG.md"
            fi
          done

      - name: Publish packages
        run: |
          # melos publish does not guarantee workspace dependency order.
          # Publish deterministically so newly-added packages exist before any
          # other package depends on them.
          #
          # Also skip packages whose current version is already published, so
          # reruns of this workflow won't try to republish the same version.
          publish_one() {
            melos publish --no-private --no-published --scope="$1" --no-dry-run --yes
          }

          publish_one continuum
          publish_one continuum_uow
          publish_one continuum_event_sourcing

          melos publish \
            --no-private \
            --no-published \
            --ignore=continuum \
            --ignore=continuum_uow \
            --ignore=continuum_event_sourcing \
            --no-dry-run \
            --yes
